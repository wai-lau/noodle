<main class="doc-card nd-card" id="noodle-admin">
  <h1 class="nd-title nd-brand">noodle</h1>
  <form id="nd-create" class="nd-create">
    <button type="submit" class="nd-submit">create poll</button>
    <p class="nd-dim nd-create-note"><a href="https://github.com/wai-lau/noodle/blob/master/VERIFY.md" target="_blank" rel="noopener noreferrer">end-to-end encrypted</a></p>
    <p id="nd-msg" class="nd-status"></p>
  </form>
  <!-- OWNER only: shown once the owner-only counts load (noodle-created.js) -->
  <section id="nd-owner" class="nd-chart" hidden aria-labelledby="nd-chart-title">
    <h2 id="nd-chart-title" class="doc-h2">polls created per day</h2>
    <p id="nd-chart-sub" class="nd-dim nd-chart-sub"></p>
    <div class="nd-chart-plot">
      <div id="nd-bars" class="nd-bars"></div>
      <p id="nd-chart-tip" class="nd-chart-tip" hidden></p>
    </div>
    <div class="nd-dim nd-chart-axis"><span id="nd-chart-from"></span><span>today</span></div>
  </section>
</main>

<script src="/noodle-claim.js?v=1"></script>
<script src="/noodle-admin.js?v=19"></script>
<script src="/noodle-created.js?v=1"></script>
