<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- maximum-scale=1: the Ask box's text is under 16px, and iOS would zoom the
     page on focus; iOS still lets the reader pinch-zoom (noodle-actions.css) -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>{{TITLE}}</title>
<!-- the Tarid Change wording first (it must see every node as it arrives),
     then the pip legend; both front ends (noodle/pages.py SKINS) -->
<script src="/noodle-tc-copy.js?v=1"></script>
<script src="/noodle-tc-legend.js?v=1" defer></script>
{{OG}}
<!-- --bg-hsl as hex (a meta tag cannot read var()). theme-color also paints an
     installed app's title bar and some browsers' toolbars, so it is the page's
     black, not green -- which also makes Discord's embed stripe black -->
{{THEME}}
<link rel="icon" href="/favicon.png">
<link rel="preload" href="/fonts/iosevka-500.woff2?v=1" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/noodle-seal.woff2?v=6" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/chrome.css?v=84">
<link rel="stylesheet" href="/noodle.css?v=106">
<link rel="stylesheet" href="/noodle-identity.css?v=5">
<link rel="stylesheet" href="/noodle-actions.css?v=8">
<link rel="stylesheet" href="/noodle-roster.css?v=1">
<link rel="stylesheet" href="/noodle-split.css?v=1">
<link rel="stylesheet" href="/noodle-admin.css?v=10">
<link rel="stylesheet" href="/noodle-created.css?v=1">
<link rel="stylesheet" href="/noodle-foot.css?v=5">
<link rel="stylesheet" href="/noodle-cal.css?v=74">
<!-- the Tarid Change structure, then EVERY palette (tokens only, each scoped
     to its body class; noodle/pages.py PALETTES) -->
<link rel="stylesheet" href="/noodle-tc.css?v=1">
<link rel="stylesheet" href="/noodle-palette.css?v=1">
{{PALETTE_CSS}}</head>
<body class="noodle noodle-tc {{PALETTE}}{{BODY_CLASS}}" data-base="{{BASE}}" data-palettes="{{PALETTES}}">
<!-- FIRST in the body, before anything paints: this browser's chosen palette -->
<script src="/noodle-palette.js?v=1"></script>
<!-- the page scrolls in chrome.css's .page-scroll wrapper; the calendar page
     and /noodle turn it static and let the document scroll (noodle-cal.css).
     No CRT stack: noodle is the one plain page (dropped 2026-10-03, feedback) -->
<div class="page-scroll">
{{BODY}}
</div>
</body>
</html>
